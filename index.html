<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result p {
            margin: 8px 0;
            font-size: 17px;
        }

        .grade {
            font-size: 25px;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>English Marks</label>
        <input type="number" id="english" placeholder="Enter marks">

        <label>Maths Marks</label>
        <input type="number" id="maths" placeholder="Enter marks">

        <label>Computer Marks</label>
        <input type="number" id="computer" placeholder="Enter marks">

        <label>Science Marks</label>
        <input type="number" id="science" placeholder="Enter marks">

        <label>Social Science Marks</label>
        <input type="number" id="social" placeholder="Enter marks">

        <button onclick="calculateGrade()">Calculate Grade</button>

        <div class="result" id="result">

            <p id="studentName"></p>

            <p>Total Marks: <span id="total"></span> / 500</p>

            <p>Percentage: <span id="percentage"></span>%</p>

            <p class="grade">Grade: <span id="grade"></span></p>

        </div>

    </div>

    <script>

        function calculateGrade() {

            let name = document.getElementById("name").value;

            let english = Number(document.getElementById("english").value);
            let maths = Number(document.getElementById("maths").value);
            let computer = Number(document.getElementById("computer").value);
            let science = Number(document.getElementById("science").value);
            let social = Number(document.getElementById("social").value);

            let total = english + maths + computer + science + social;

            let percentage = (total / 500) * 100;

            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            document.getElementById("studentName").innerHTML =
                "Student: " + name;

            document.getElementById("total").innerHTML = total;

            document.getElementById("percentage").innerHTML =
                percentage.toFixed(2);

            document.getElementById("grade").innerHTML = grade;

            document.getElementById("result").style.display = "block";
        }

    </script>

</body>
</html>
